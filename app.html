<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糖尿病用藥決策支援系統</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Microsoft JhengHei', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    h1 { text-align: center; color: #2c3e50; }
    .status-bar { text-align: center; background: #e8f6f3; padding: 8px; border-radius: 4px; color: #16a085; margin-bottom: 20px; display: none; }
    .patient-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 40px; }
    .patient-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
    .patient-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .patient-card h3 { margin: 0 0 10px 0; color: #3498db; }
    .patient-card p { margin: 5px 0; color: #555; }
    .content { display: none; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
    .back-btn {
      position: absolute; top: 20px; left: 20px;
      background: #3498db; color: white; border: none; padding: 8px 16px;
      border-radius: 8px; cursor: pointer; transition: 0.3s;
    }
    .back-btn:hover { background: #2980b9; }
    canvas { max-height: 350px; width: 100%; }
    .indicators { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin: 30px 0; }
    .indicator-box { text-align: center; min-width: 120px; }
    .bar { height: 40px; border-radius: 8px; line-height: 40px; color: white; font-weight: bold; font-size: 1.2em; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); margin-top: 5px; }
    .green { background: #27ae60; }
    .yellow { background: #f39c12; }
    .red { background: #e74c3c; }
    .recommendations { margin-top: 30px; }
    .rec-item { background: #f8f9fa; padding: 15px; border-left: 5px solid #3498db; margin: 10px 0; border-radius: 6px; }
    .rec-high { border-left-color: #e74c3c; background: #fdf2f2; }
    .rec-good { border-left-color: #27ae60; background: #f0fff4; }
    footer { text-align: center; margin-top: 50px; color: #95a5a6; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>糖尿病用藥決策支援系統</h1>
    <p style="text-align:center; color:#7f8c8d;">基於 ADA 2025 指引 • 個人化用藥建議</p>
    
    <div id="smartStatus" class="status-bar"></div>

    <h2 style="color:#2c3e50;" id="selectorTitle">請選擇測試個案</h2>
    <div class="patient-selector" id="patientSelector"></div>

    <div class="content" id="patientContent">
      <button class="back-btn" id="backBtn" onclick="backToSelector()">← 返回列表</button>

      <h2 id="patientName" style="margin-left:40px; margin-top: 0;"></h2>
      <p id="patientInfo" style="margin-left:40px;"></p>

      <h3 style="margin-left:40px;">HbA1c 趨勢圖 (24個月)</h3>
      <canvas id="hba1cChart"></canvas>

      <h3 style="margin-left:40px;">臨床關鍵指標</h3>
      <div class="indicators" id="indicators"></div>

      <h3 style="margin-left:40px;">CDS 建議 (ADA 2025)</h3>
      <div class="recommendations" id="recommendations"></div>
    </div>
  </div>

  <footer>測試資料來源：THAS FHIR Sandbox • 2025-12-28 • 僅供教育與展示用途</footer>

  <script>
    // === 1. 補全後的測試資料 (5位) ===
    const testPatients = [
      {
        id: "683785",
        name: "陳志明",
        gender: "男", age: 45,
        scenario: "年輕新診斷，HbA1c 略高",
        target: 7.0, latestHba1c: 7.1, egfr: 90, bmi: 27,
        hba1cSeries: [9.5,9.3,9.0,8.8,8.5,8.3,8.1,8.0,7.9,7.8,7.7,7.6,7.5,7.4,7.3,7.3,7.2,7.2,7.1,7.1,7.1,7.1,7.1,7.1,7.1]
      },
      {
        id: "683813",
        name: "王小明",
        gender: "男", age: 62,
        scenario: "糖尿病合併中度腎病變 (CKD 3)",
        target: 7.5, latestHba1c: 7.6, egfr: 45, bmi: 26,
        hba1cSeries: [8.5,8.4,8.3,8.2,8.1,8.0,7.9,7.9,7.8,7.8,7.7,7.7,7.7,7.7,7.6,7.6,7.6,7.6,7.6,7.6,7.6,7.6,7.6,7.6,7.6]
      },
      {
        id: "683847",
        name: "林阿花",
        gender: "女", age: 65,
        scenario: "高齡多共病，控制目標放寬",
        target: 8.0, latestHba1c: 7.5, egfr: 55, bmi: 22,
        hba1cSeries: [7.8,7.7,7.6,7.7,7.5,7.6,7.8,7.7,7.6,7.5,7.6,7.7,7.5,7.6,7.4,7.5,7.6,7.7,7.6,7.5,7.6,7.7,7.5,7.6,7.5]
      },
      // 補上的第4位
      {
        id: "683900",
        name: "張建國",
        gender: "男", age: 55,
        scenario: "肥胖合併心血管風險",
        target: 7.0, latestHba1c: 8.2, egfr: 85, bmi: 32,
        hba1cSeries: [8.0,8.1,8.2,8.3,8.2,8.4,8.5,8.6,8.5,8.4,8.3,8.3,8.2,8.2,8.1,8.2,8.3,8.3,8.2,8.2,8.3,8.2,8.2,8.2,8.2]
      },
      // 補上的第5位
      {
        id: "683950",
        name: "李淑芬",
        gender: "女", age: 38,
        scenario: "早期診斷，控制良好",
        target: 6.5, latestHba1c: 6.2, egfr: 100, bmi: 21,
        hba1cSeries: [6.8,6.7,6.6,6.5,6.5,6.4,6.4,6.3,6.3,6.2,6.2,6.2,6.2,6.1,6.1,6.2,6.2,6.2,6.2,6.2,6.2,6.2,6.2,6.2,6.2]
      }
    ];

    let myChart = null;

    // === 2. 初始化與 SMART 連線邏輯 ===
    window.onload = function() {
        // 初始化列表
        renderSelector();

        // 嘗試建立 SMART 連線 [Cite: PDF p.34-36]
        FHIR.oauth2.ready()
            .then(client => {
                // 連線成功
                const statusDiv = document.getElementById('smartStatus');
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = `✅ 已連線至 SMART Context (Patient ID: ${client.patient.id || 'Unknown'})`;
                
                // 如果 Context 中有指定病人，自動載入該病人資料
                if (client.patient.id) {
                    const matchedPatient = testPatients.find(p => p.id === client.patient.id);
                    if (matchedPatient) {
                        loadPatient(matchedPatient);
                        // 隱藏返回按鈕，因為在 EHR 內通常不需要返回列表
                        document.getElementById('backBtn').style.display = 'none';
                    } else {
                        // 若 ID 不在測試資料中，顯示提示
                        statusDiv.innerHTML += "<br>⚠️ 注意：此病人 ID 不在內建測試資料中，請手動選擇以預覽功能。";
                    }
                }
            })
            .catch(error => {
                console.log("非 SMART 啟動或連線失敗，進入單機展示模式:", error);
            });
    };

    // 渲染選擇列表
    function renderSelector() {
        const container = document.getElementById('patientSelector');
        container.innerHTML = testPatients.map(p => `
            <div class="patient-card" onclick='loadPatientById("${p.id}")'>
                <h3>${p.name} (${p.gender}, ${p.age}歲)</h3>
                <p><strong>情境：</strong>${p.scenario}</p>
                <p>最新 HbA1c: ${p.latestHba1c}% (目標: < ${p.target}%)</p>
                <p>ID: ${p.id}</p>
            </div>
        `).join('');
    }

    // 透過 ID 載入 (供 onclick 使用)
    function loadPatientById(id) {
        const p = testPatients.find(item => item.id === id);
        if(p) loadPatient(p);
    }

    // 顯示病人詳細資料
    function loadPatient(p) {
        // UI 切換
        document.getElementById('patientSelector').style.display = 'none';
        document.getElementById('selectorTitle').style.display = 'none';
        document.getElementById('patientContent').style.display = 'block';

        // 填入基本資料
        document.getElementById('patientName').innerText = `${p.name} (${p.gender}, ${p.age}歲)`;
        document.getElementById('patientInfo').innerHTML = 
            `ID: ${p.id} | BMI: ${p.bmi} | eGFR: ${p.egfr} ml/min | <strong>情境：${p.scenario}</strong>`;

        // 繪製圖表
        renderChart(p.hba1cSeries, p.target);

        // 渲染指標
        renderIndicators(p);

        // 產生建議
        renderRecommendations(p);
    }

    function backToSelector() {
        document.getElementById('patientContent').style.display = 'none';
        document.getElementById('patientSelector').style.display = 'grid';
        document.getElementById('selectorTitle').style.display = 'block';
    }

    // === 3. 圖表繪製 logic ===
    function renderChart(data, target) {
        const ctx = document.getElementById('hba1cChart').getContext('2d');
        
        if (myChart) myChart.destroy();

        // 產生 X 軸標籤 (過去24個月)
        const labels = Array.from({length: 25}, (_, i) => `M-${24-i}`);

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'HbA1c (%)',
                        data: data,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: '個人化目標值',
                        data: Array(25).fill(target),
                        borderColor: '#e74c3c',
                        borderDash: [5, 5],
                        pointRadius: 0,
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { min: 5, max: 12, title: { display: true, text: 'HbA1c %' } }
                }
            }
        });
    }

    // === 4. 指標渲染 logic ===
    function renderIndicators(p) {
        // 顏色判斷 helper
        const getColor = (val, target, type) => {
            if (type === 'hba1c') return val <= target ? 'green' : (val <= target + 0.5 ? 'yellow' : 'red');
            if (type === 'egfr') return val >= 60 ? 'green' : (val >= 30 ? 'yellow' : 'red');
            if (type === 'bmi') return val < 24 ? 'green' : (val < 27 ? 'yellow' : 'red');
            return 'green';
        };

        const html = `
            <div class="indicator-box">
                <div>HbA1c</div>
                <div class="bar ${getColor(p.latestHba1c, p.target, 'hba1c')}">${p.latestHba1c}%</div>
                <small>目標 < ${p.target}</small>
            </div>
            <div class="indicator-box">
                <div>eGFR</div>
                <div class="bar ${getColor(p.egfr, 0, 'egfr')}">${p.egfr}</div>
                <small>腎功能</small>
            </div>
            <div class="indicator-box">
                <div>BMI</div>
                <div class="bar ${getColor(p.bmi, 0, 'bmi')}">${p.bmi}</div>
                <small>體重指數</small>
            </div>
        `;
        document.getElementById('indicators').innerHTML = html;
    }

    // === 5. 建議生成 logic (簡單規則庫) ===
    function renderRecommendations(p) {
        let recs = "";

        // 規則 1: HbA1c 判斷
        if (p.latestHba1c > p.target) {
            recs += `<div class="rec-item rec-high"><strong>⚠️ 血糖未達標：</strong> 目前 HbA1c (${p.latestHba1c}%) 高於目標 (${p.target}%)。建議檢視飲食依從性，並考慮強化藥物治療。</div>`;
        } else {
            recs += `<div class="rec-item rec-good"><strong>✅ 血糖控制良好：</strong> 持續目前生活型態與用藥。</div>`;
        }

        // 規則 2: 腎功能判斷 (ADA 建議 SGLT2i)
        if (p.egfr < 60) {
            recs += `<div class="rec-item"><strong>💊 腎臟保護：</strong> 檢測到 eGFR 低於 60。根據 ADA 指引，建議優先考慮使用 <strong>SGLT2 抑制劑</strong> 以延緩腎病變進展（若無禁忌症）。</div>`;
        }

        // 規則 3: 肥胖判斷 (ADA 建議 GLP-1 RA)
        if (p.bmi >= 27) {
            recs += `<div class="rec-item"><strong>⚖️ 體重管理：</strong> BMI 顯示過重/肥胖。建議優先考慮使用 <strong>GLP-1 受體促效劑</strong>，兼顧血糖與體重控制。</div>`;
        }

        document.getElementById('recommendations').innerHTML = recs;
    }
  </script>
</body>
</html>
